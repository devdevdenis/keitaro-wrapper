services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro_wrapper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro -d keitaro_wrapper"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@db:5432/keitaro_wrapper
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
